[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textmarker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.1", "lxml>=5"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
test = ["pytest>=8"]
gui-test = ["PySide6==6.7.3", "shiboken6==6.7.3"]

[project.scripts]
textmarker = "textmarker.__main__:main"
textmarker-gui = "textmarker.ui.main_window:main"

[tool.setuptools.package-data]
textmarker = ["multilingual/locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
